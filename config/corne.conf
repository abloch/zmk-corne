# ZMK Studio is enabled in build.yaml, on the left (central) half only: the
# snippet studio-rpc-usb-uart carries the USB RPC transport, and the CONFIG
# rides along as a cmake-arg. Setting it here would ship it to both halves.
#
# That reasoning covers the rest of the Studio settings too, so none of them are
# here either. Every CONFIG_ZMK_STUDIO_* symbol lives inside "if ZMK_STUDIO" in
# ZMK's app/src/studio/Kconfig, which means that on the right half, where
# ZMK_STUDIO is never set, an assignment in this file would be naming a symbol
# that does not exist in that build. Anything worth tuning has to ride along in
# the same cmake-args as CONFIG_ZMK_STUDIO itself.
#
# Locking stays at its default, which is on: ZMK_STUDIO_RPC implies
# ZMK_STUDIO_LOCKING, so the board ignores everything Studio asks of it until
# &studio_unlock is pressed on layer 5, then relocks after
# CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC of inactivity and again on disconnect.
# Setting CONFIG_ZMK_STUDIO_LOCKING=n would drop the unlock step altogether, and
# that is not a keypress worth trading a locked keymap for.

# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# Pointer button support. Mouse movement and scroll are retired (the trackpad owns
# the pointer); only the four pointer-button combos survive, and &mkp needs this.
CONFIG_ZMK_POINTING=y

# No combo budget knobs here: upstream deprecated both of them. Per-key combo
# storage is now determined automatically, and keys-per-combo is auto-calculated
# from key-positions in devicetree, so the O + P Bluetooth grid and the six-key
# clear-all size themselves.

# Enable Soft Off for power saving
CONFIG_ZMK_PM_SOFT_OFF=y

# Experimental Bluetooth features for better battery and connection
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# 15 minutes of inactivity before entering deep sleep (ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Split battery reporting improvements
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Bluetooth TX power - higher for better stability between halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce settings for better responsiveness
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
